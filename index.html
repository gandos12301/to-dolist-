<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2EEE4">
<title>Tugasku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-layar="beranda">
<main class="app">

  <!-- Layar 1: Beranda -->
  <section id="beranda" class="layar">
    <div class="atas">
      <div class="avatar">G</div>
      <div class="sapa"><small id="tglHariIni"></small><b>Halo, Gandhi</b></div>
    </div>
    <h1 id="judulHari"></h1>
    <p class="sub" id="subHari"></p>

    <label class="cari">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B675F" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="cari" placeholder="Cari tugas..." aria-label="Cari tugas">
    </label>

    <div class="chips" id="filter">
      <button class="chip a" data-f="semua">Semua</button>
      <button class="chip" data-f="hari">Hari ini</button>
      <button class="chip" data-f="selesai">Selesai</button>
    </div>

    <div class="kartu" id="kartu"></div>
    <h2 class="seksi">Daftar tugasmu</h2>
    <div class="daftar" id="daftar"></div>
  </section>

  <!-- Layar 2: Jadwal -->
  <section id="jadwal" class="layar" hidden>
    <div class="bar">
      <button class="ib" data-ke="beranda" aria-label="Kembali"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <b>Jadwal</b>
      <span style="width:44px"></span>
    </div>
    <div class="tajuk">
      <h1 id="bulanJudul"></h1>
      <div class="bln">
        <button class="ib" id="bulanSbl" aria-label="Bulan sebelumnya"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="ib" id="bulanSsd" aria-label="Bulan berikutnya"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </div>
    <div class="minggu lb"><span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span><span>Min</span></div>
    <div class="kal" id="kal"></div>
    <div class="seksi-baris"><h2 class="seksi" id="agendaJudul"></h2><small id="agendaJml"></small></div>
    <div class="daftar" id="agenda"></div>
  </section>

  <!-- Layar 3: Tugas baru -->
  <section id="tambah" class="layar" hidden>
    <div class="bar">
      <button class="ib" data-ke="beranda" aria-label="Kembali"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <b>Tugas baru</b>
      <span style="width:44px"></span>
    </div>
    <h1 style="margin-top:22px">Apa yang mau<br>dikerjakan?</h1>

    <label class="lb blok">Judul
      <input class="in" id="fJudul" maxlength="120" autocomplete="off" placeholder="Contoh: Laporan Praktikum">
    </label>
    <p class="galat" id="galat" hidden>Judul tugas wajib diisi.</p>

    <div class="lb blok">Kategori</div>
    <div class="pilih" data-nama="kategori">
      <button type="button" class="chip" data-v="Kuliah">Kuliah</button>
      <button type="button" class="chip" data-v="Organisasi">Organisasi</button>
      <button type="button" class="chip" data-v="Pribadi">Pribadi</button>
    </div>

    <div class="dua blok">
      <label class="lb">Tenggat<input class="in" type="date" id="fTgl"></label>
      <label class="lb">Jam<input class="in" type="time" id="fJam"></label>
    </div>

    <div class="lb blok">Prioritas</div>
    <div class="pilih seg" data-nama="prio">
      <button type="button" class="chip" data-v="Rendah">Rendah</button>
      <button type="button" class="chip" data-v="Sedang">Sedang</button>
      <button type="button" class="chip" data-v="Tinggi">Tinggi</button>
    </div>

    <label class="lb blok">Catatan
      <textarea class="in" id="fCatatan" placeholder="Opsional"></textarea>
    </label>

    <button class="simpan" id="simpan">Simpan tugas</button>
  </section>

</main>

<!-- Navigasi bawah -->
<nav class="nav" aria-label="Menu utama">
  <button class="nb on" data-ke="beranda" aria-label="Beranda"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
  <button class="plus" data-ke="tambah" aria-label="Tambah tugas"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="nb" data-ke="jadwal" aria-label="Jadwal"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></button>
</nav>

<script src="script.js"></script>
</body>
</html>
